name: Refresh data and charts

on:
  schedule:
    # Daily at 12:00 UTC (7 AM Austin during daylight time); Meteostat usually lags a day or two.
    - cron: "0 12 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: refresh-data
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      # Retrieval runs first inside refresh_all.py, so every chart is built from fresh data.
      - name: Retrieve data and regenerate charts
        run: python outputs/refresh_all.py

      - name: Run tests
        run: python -m pytest -q tests

      - name: Commit updated data and charts
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898299+github-actions[bot]@users.noreply.github.com"
          git add data/austin_daily_weather.csv outputs/*.png outputs/social docs/assets/*.png
          if git diff --cached --quiet; then
            echo "No data or chart changes."
          else
            git commit -m "Refresh Austin weather data and charts ($(date -u +%Y-%m-%d))"
            git push
          fi
